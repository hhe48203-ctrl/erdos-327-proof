name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          test: false
          lint: false
      - name: Check explicit epsilon certificate
        working-directory: lean
        run: lake env lean ../audit/EffectiveEpsilon.lean
